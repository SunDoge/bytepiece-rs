[package]
name = "bytepiece-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JavaScript and WebAssembly bindings for BytePiece"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytepiece.workspace = true
wasm-bindgen = "=0.2.128"
js-sys = "0.3.105"
unicode-normalization = "0.1.25"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
fastrand = { version = "2.5.0", features = ["js"] }
